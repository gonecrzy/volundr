[project]
name = "volundr-backend"
version = "0.1.0"
description = "FastAPI backend and CAD execution foundation for Volundr."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "numpy>=2.0",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "trimesh>=4.5",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
