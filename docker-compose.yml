services:
  volundr-web:
    container_name: volundr-web
    build:
      context: ./frontend
      args:
        VITE_VOLUNDR_GENERATION_MODE: ${VITE_VOLUNDR_GENERATION_MODE:-advanced}
        VITE_VOLUNDR_CHAT_FIRST: ${VITE_VOLUNDR_CHAT_FIRST:-true}
    restart: unless-stopped
    depends_on:
      volundr-api:
        condition: service_healthy
    ports:
      - "${VOLUNDR_WEB_PORT:-8080}:80"
    networks:
      - volundr-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  volundr-api:
    container_name: volundr-api
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      volundr-cad-worker:
        condition: service_healthy
    environment:
      HOME: /home/volundr
      VOLUNDR_DATA_DIR: /app/data
      VOLUNDR_CAD_WORKSPACE_DIR: /app/data/jobs
      VOLUNDR_CAD_TIMEOUT_SECONDS: ${VOLUNDR_CAD_TIMEOUT_SECONDS:-60}
      VOLUNDR_WORKFLOW_STALE_SECONDS: ${VOLUNDR_WORKFLOW_STALE_SECONDS:-900}
      VOLUNDR_CORS_ORIGINS: ${VOLUNDR_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      VOLUNDR_MAX_SOURCE_BYTES: ${VOLUNDR_MAX_SOURCE_BYTES:-512000}
      VOLUNDR_MAX_STL_BYTES: ${VOLUNDR_MAX_STL_BYTES:-104857600}
      VOLUNDR_AI_PROVIDER: ${VOLUNDR_AI_PROVIDER:-gemini_api}
      VOLUNDR_OLLAMA_BASE_URL: ${VOLUNDR_OLLAMA_BASE_URL:-http://10.1.20.25:11434}
      VOLUNDR_OLLAMA_MODEL: ${VOLUNDR_OLLAMA_MODEL:-qwen2.5-coder:14b}
      VOLUNDR_OLLAMA_TIMEOUT_SECONDS: ${VOLUNDR_OLLAMA_TIMEOUT_SECONDS:-300}
      VOLUNDR_OLLAMA_THINK: ${VOLUNDR_OLLAMA_THINK:-}
      VOLUNDR_GEMINI_BINARY: ${VOLUNDR_GEMINI_BINARY:-gemini}
      VOLUNDR_GEMINI_MODEL: ${VOLUNDR_GEMINI_MODEL:-gemini-3.5-flash-lite}
      VOLUNDR_GEMINI_REQUIREMENTS_MODEL: ${VOLUNDR_GEMINI_REQUIREMENTS_MODEL:-}
      VOLUNDR_GEMINI_DESIGN_PLAN_MODEL: ${VOLUNDR_GEMINI_DESIGN_PLAN_MODEL:-}
      VOLUNDR_GEMINI_GEOMETRY_MODEL: ${VOLUNDR_GEMINI_GEOMETRY_MODEL:-}
      VOLUNDR_GEMINI_GEOMETRY_REPAIR_MODEL: ${VOLUNDR_GEMINI_GEOMETRY_REPAIR_MODEL:-}
      VOLUNDR_GEMINI_REVISION_PLANNING_MODEL: ${VOLUNDR_GEMINI_REVISION_PLANNING_MODEL:-}
      VOLUNDR_GEMINI_COMPONENT_REVISION_MODEL: ${VOLUNDR_GEMINI_COMPONENT_REVISION_MODEL:-}
      VOLUNDR_GEMINI_TIMEOUT_SECONDS: ${VOLUNDR_GEMINI_TIMEOUT_SECONDS:-120}
      VOLUNDR_GEMINI_POLICY_PATH: ${VOLUNDR_GEMINI_POLICY_PATH:-}
      VOLUNDR_GEMINI_API_BASE_URL: ${VOLUNDR_GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      VOLUNDR_GEMINI_API_TEMPERATURE: ${VOLUNDR_GEMINI_API_TEMPERATURE:-0.2}
      VOLUNDR_GEMINI_API_MAX_OUTPUT_TOKENS: ${VOLUNDR_GEMINI_API_MAX_OUTPUT_TOKENS:-8192}
      VOLUNDR_GEMINI_API_THINKING_LEVEL: ${VOLUNDR_GEMINI_API_THINKING_LEVEL:-minimal}
      VOLUNDR_GEMINI_API_MAX_RETRIES: ${VOLUNDR_GEMINI_API_MAX_RETRIES:-2}
      VOLUNDR_GEMINI_API_MAX_RETRY_SLEEP_SECONDS: ${VOLUNDR_GEMINI_API_MAX_RETRY_SLEEP_SECONDS:-60}
      VOLUNDR_GENERATION_MODE: ${VOLUNDR_GENERATION_MODE:-advanced}
      VOLUNDR_ENABLE_DESIGN_PLANS: ${VOLUNDR_ENABLE_DESIGN_PLANS:-true}
      VOLUNDR_ENABLE_MULTI_OUTPUT: ${VOLUNDR_ENABLE_MULTI_OUTPUT:-true}
      VOLUNDR_ENABLE_STRUCTURED_REVISIONS: ${VOLUNDR_ENABLE_STRUCTURED_REVISIONS:-true}
      VOLUNDR_CHAT_FIRST: ${VOLUNDR_CHAT_FIRST:-true}
      VOLUNDR_SNAPSHOTS_ENABLED: ${VOLUNDR_SNAPSHOTS_ENABLED:-true}
      VOLUNDR_SNAPSHOT_IMAGE_WIDTH: ${VOLUNDR_SNAPSHOT_IMAGE_WIDTH:-768}
      VOLUNDR_SNAPSHOT_IMAGE_HEIGHT: ${VOLUNDR_SNAPSHOT_IMAGE_HEIGHT:-768}
      VOLUNDR_SNAPSHOT_TIMEOUT_SECONDS: ${VOLUNDR_SNAPSHOT_TIMEOUT_SECONDS:-30}
      VOLUNDR_SNAPSHOT_MAX_WHOLE_DESIGN_VIEWS: ${VOLUNDR_SNAPSHOT_MAX_WHOLE_DESIGN_VIEWS:-5}
      VOLUNDR_SNAPSHOT_MAX_COMPONENTS: ${VOLUNDR_SNAPSHOT_MAX_COMPONENTS:-24}
      VOLUNDR_SNAPSHOT_SECTION_ENABLED: ${VOLUNDR_SNAPSHOT_SECTION_ENABLED:-true}
      VOLUNDR_SNAPSHOT_BACKGROUND: ${VOLUNDR_SNAPSHOT_BACKGROUND:-neutral_light}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${VOLUNDR_API_PORT:-8000}:8000"
    volumes:
      - ${VOLUNDR_DATA_DIR:-./data}:/app/data
      - ${VOLUNDR_GEMINI_DIR:-./data/gemini}:/home/volundr/.gemini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - volundr-internal

  volundr-cad-worker:
    container_name: volundr-cad-worker
    build:
      context: .
      dockerfile: cad-worker/Dockerfile
    restart: unless-stopped
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1024m
    cpus: 1.0
    environment:
      VOLUNDR_CAD_WORKSPACE_DIR: /work/jobs
      VOLUNDR_CAD_TIMEOUT_SECONDS: ${VOLUNDR_CAD_TIMEOUT_SECONDS:-60}
    volumes:
      - ${VOLUNDR_DATA_DIR:-./data}/jobs:/work/jobs
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'app.workers.cad_worker' in Path('/proc/1/cmdline').read_bytes()"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  volundr-internal:
    name: volundr-internal
