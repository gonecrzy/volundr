services:
  volundr-web:
    container_name: volundr-web
    build:
      context: ./frontend
      args:
        VITE_VOLUNDR_GENERATION_MODE: ${VITE_VOLUNDR_GENERATION_MODE:-simple}
    restart: unless-stopped
    depends_on:
      - volundr-api
    ports:
      - "${VOLUNDR_WEB_PORT:-8080}:80"
    networks:
      - volundr-internal

  volundr-api:
    container_name: volundr-api
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      HOME: /home/volundr
      VOLUNDR_DATA_DIR: /app/data
      VOLUNDR_CAD_WORKSPACE_DIR: /app/data/jobs
      VOLUNDR_AI_PROVIDER: ${VOLUNDR_AI_PROVIDER:-ollama}
      VOLUNDR_OLLAMA_BASE_URL: ${VOLUNDR_OLLAMA_BASE_URL:-http://10.1.20.25:11434}
      VOLUNDR_OLLAMA_MODEL: ${VOLUNDR_OLLAMA_MODEL:-qwen3.5:9b}
      VOLUNDR_OLLAMA_TIMEOUT_SECONDS: ${VOLUNDR_OLLAMA_TIMEOUT_SECONDS:-300}
      VOLUNDR_GEMINI_BINARY: gemini
      VOLUNDR_GEMINI_MODEL: ${VOLUNDR_GEMINI_MODEL:-gemini-3.5-flash-lite}
      VOLUNDR_GENERATION_MODE: ${VOLUNDR_GENERATION_MODE:-simple}
      VOLUNDR_ENABLE_DESIGN_PLANS: ${VOLUNDR_ENABLE_DESIGN_PLANS:-false}
      VOLUNDR_ENABLE_MULTI_OUTPUT: ${VOLUNDR_ENABLE_MULTI_OUTPUT:-false}
      VOLUNDR_ENABLE_STRUCTURED_REVISIONS: ${VOLUNDR_ENABLE_STRUCTURED_REVISIONS:-false}
      VOLUNDR_ENABLE_STRICT_MARKER_CONTRACT: ${VOLUNDR_ENABLE_STRICT_MARKER_CONTRACT:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ${VOLUNDR_DATA_DIR:-./data}:/app/data
      - ${VOLUNDR_GEMINI_DIR:-./data/gemini}:/home/volundr/.gemini
    networks:
      - volundr-internal

  volundr-cad-worker:
    container_name: volundr-cad-worker
    build:
      context: .
      dockerfile: cad-worker/Dockerfile
    restart: unless-stopped
    environment:
      VOLUNDR_CAD_WORKSPACE_DIR: /work/jobs
      VOLUNDR_OPENSCAD_BINARY: /usr/bin/openscad
    volumes:
      - ${VOLUNDR_DATA_DIR:-./data}/jobs:/work/jobs
    networks:
      - volundr-internal

networks:
  volundr-internal:
    name: volundr-internal
