services:
  volundr-web:
    container_name: volundr-web
    build:
      context: ./frontend
      args:
        VITE_VOLUNDR_CHAT_FIRST: ${VITE_VOLUNDR_CHAT_FIRST:-true}
        VITE_VOLUNDR_VALIDATED_CADQUERY_FLOW_ENABLED: ${VITE_VOLUNDR_VALIDATED_CADQUERY_FLOW_ENABLED:-false}
        VITE_VOLUNDR_EXECUTABLE_CADQUERY_FLOW_ENABLED: ${VITE_VOLUNDR_EXECUTABLE_CADQUERY_FLOW_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      volundr-api:
        condition: service_healthy
    ports:
      - "${VOLUNDR_WEB_PORT:-8080}:80"
    networks:
      - volundr-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  volundr-api:
    container_name: volundr-api
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      volundr-cad-worker:
        condition: service_healthy
    environment:
      HOME: /home/volundr
      VOLUNDR_DATA_DIR: /app/data
      VOLUNDR_BUILD_GIT_SHA: ${VOLUNDR_BUILD_GIT_SHA:-}
      VOLUNDR_BUILD_BRANCH: ${VOLUNDR_BUILD_BRANCH:-}
      VOLUNDR_BUILD_TIMESTAMP: ${VOLUNDR_BUILD_TIMESTAMP:-}
      VOLUNDR_BUILD_DIRTY: ${VOLUNDR_BUILD_DIRTY:-}
      VOLUNDR_BUILD_RELEASE_LABEL: ${VOLUNDR_BUILD_RELEASE_LABEL:-}
      VOLUNDR_WORKER_BUILD_GIT_SHA: ${VOLUNDR_WORKER_BUILD_GIT_SHA:-}
      VOLUNDR_WORKER_BUILD_TIMESTAMP: ${VOLUNDR_WORKER_BUILD_TIMESTAMP:-}
      VOLUNDR_WORKER_BUILD_DIRTY: ${VOLUNDR_WORKER_BUILD_DIRTY:-}
      VOLUNDR_CAD_TIMEOUT_SECONDS: ${VOLUNDR_CAD_TIMEOUT_SECONDS:-60}
      VOLUNDR_WORKFLOW_STALE_SECONDS: ${VOLUNDR_WORKFLOW_STALE_SECONDS:-900}
      VOLUNDR_MAX_SOURCE_BYTES: ${VOLUNDR_MAX_SOURCE_BYTES:-512000}
      VOLUNDR_MAX_STL_BYTES: ${VOLUNDR_MAX_STL_BYTES:-104857600}
      VOLUNDR_AI_PROVIDER: ${VOLUNDR_AI_PROVIDER:-gemini_api}
      VOLUNDR_OLLAMA_BASE_URL: ${VOLUNDR_OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      VOLUNDR_OLLAMA_MODEL: ${VOLUNDR_OLLAMA_MODEL:-qwen2.5-coder:14b}
      VOLUNDR_OLLAMA_TIMEOUT_SECONDS: ${VOLUNDR_OLLAMA_TIMEOUT_SECONDS:-300}
      VOLUNDR_OLLAMA_THINK: ${VOLUNDR_OLLAMA_THINK:-}
      VOLUNDR_GEMINI_BINARY: ${VOLUNDR_GEMINI_BINARY:-gemini}
      VOLUNDR_GEMINI_MODEL: ${VOLUNDR_GEMINI_MODEL:-gemini-3.5-flash-lite}
      VOLUNDR_GEMINI_TIMEOUT_SECONDS: ${VOLUNDR_GEMINI_TIMEOUT_SECONDS:-120}
      VOLUNDR_GEMINI_POLICY_PATH: ${VOLUNDR_GEMINI_POLICY_PATH:-}
      VOLUNDR_GEMINI_PRIMARY_CREDENTIAL_ENV: ${VOLUNDR_GEMINI_PRIMARY_CREDENTIAL_ENV:-GEMINI_API_KEY_2}
      VOLUNDR_GEMINI_FALLBACK_CREDENTIAL_ENV: ${VOLUNDR_GEMINI_FALLBACK_CREDENTIAL_ENV:-GEMINI_API_KEY}
      VOLUNDR_GEMINI_API_BASE_URL: ${VOLUNDR_GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      VOLUNDR_CODEX_API_BASE_URL: ${VOLUNDR_CODEX_API_BASE_URL:-}
      VOLUNDR_CODEX_API_KEY: ${VOLUNDR_CODEX_API_KEY:-}
      VOLUNDR_CODEX_MODEL: ${VOLUNDR_CODEX_MODEL:-}
      VOLUNDR_CODEX_API_MODE: ${VOLUNDR_CODEX_API_MODE:-responses}
      VOLUNDR_CODEX_TIMEOUT_SECONDS: ${VOLUNDR_CODEX_TIMEOUT_SECONDS:-120}
      VOLUNDR_CODEX_REASONING_EFFORT: ${VOLUNDR_CODEX_REASONING_EFFORT:-xhigh}
      VOLUNDR_SNAPSHOTS_ENABLED: ${VOLUNDR_SNAPSHOTS_ENABLED:-true}
      VOLUNDR_DEVELOPER_TOOLS_ENABLED: ${VOLUNDR_DEVELOPER_TOOLS_ENABLED:-false}
      VOLUNDR_VALIDATED_CADQUERY_FLOW_ENABLED: ${VOLUNDR_VALIDATED_CADQUERY_FLOW_ENABLED:-false}
      VOLUNDR_EXECUTABLE_CADQUERY_FLOW_ENABLED: ${VOLUNDR_EXECUTABLE_CADQUERY_FLOW_ENABLED:-false}
      VOLUNDR_EXECUTABLE_CADQUERY_CORPUS_MANIFEST_PATH: ${VOLUNDR_EXECUTABLE_CADQUERY_CORPUS_MANIFEST_PATH:-}
      VOLUNDR_VALIDATED_GEOMETRY_PROVIDER: ${VOLUNDR_VALIDATED_GEOMETRY_PROVIDER:-gemini_api}
      VOLUNDR_VALIDATED_API_DIRECT_ACCESS_ENABLED: ${VOLUNDR_VALIDATED_API_DIRECT_ACCESS_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:-}
    ports:
      - "${VOLUNDR_API_BIND_ADDRESS:-127.0.0.1}:${VOLUNDR_API_PORT:-8000}:8000"
    volumes:
      - ${VOLUNDR_DATA_DIR:-./data}:/app/data
      - ${VOLUNDR_GEMINI_DIR:-${VOLUNDR_DATA_DIR:-./data}/gemini}:/home/volundr/.gemini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - volundr-internal

  volundr-cad-worker:
    container_name: volundr-cad-worker
    build:
      context: .
      dockerfile: cad-worker/Dockerfile
    restart: unless-stopped
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1024m
    cpus: 1.0
    environment:
      VOLUNDR_DATA_DIR: /work
      VOLUNDR_BUILD_GIT_SHA: ${VOLUNDR_BUILD_GIT_SHA:-}
      VOLUNDR_BUILD_BRANCH: ${VOLUNDR_BUILD_BRANCH:-}
      VOLUNDR_BUILD_TIMESTAMP: ${VOLUNDR_BUILD_TIMESTAMP:-}
      VOLUNDR_BUILD_DIRTY: ${VOLUNDR_BUILD_DIRTY:-}
      VOLUNDR_WORKER_BUILD_GIT_SHA: ${VOLUNDR_WORKER_BUILD_GIT_SHA:-}
      VOLUNDR_WORKER_BUILD_TIMESTAMP: ${VOLUNDR_WORKER_BUILD_TIMESTAMP:-}
      VOLUNDR_WORKER_BUILD_DIRTY: ${VOLUNDR_WORKER_BUILD_DIRTY:-}
      VOLUNDR_CAD_TIMEOUT_SECONDS: ${VOLUNDR_CAD_TIMEOUT_SECONDS:-60}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
      NUMEXPR_NUM_THREADS: ${NUMEXPR_NUM_THREADS:-1}
      VTK_SMP_MAX_THREADS: ${VTK_SMP_MAX_THREADS:-1}
    volumes:
      - ${VOLUNDR_DATA_DIR:-./data}/jobs:/work/jobs
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'app.workers.cad_worker' in Path('/proc/1/cmdline').read_bytes()"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  volundr-internal:
    name: volundr-internal
