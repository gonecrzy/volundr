services:
  volundr-web:
    container_name: volundr-web
    build:
      context: ./frontend
      args:
        VITE_VOLUNDR_GENERATION_MODE: ${VITE_VOLUNDR_GENERATION_MODE:-advanced}
    restart: unless-stopped
    depends_on:
      - volundr-api
    ports:
      - "${VOLUNDR_WEB_PORT:-8080}:80"
    networks:
      - volundr-internal

  volundr-api:
    container_name: volundr-api
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      HOME: /home/volundr
      VOLUNDR_DATA_DIR: /app/data
      VOLUNDR_CAD_WORKSPACE_DIR: /app/data/jobs
      VOLUNDR_CAD_TIMEOUT_SECONDS: ${VOLUNDR_CAD_TIMEOUT_SECONDS:-60}
      VOLUNDR_MAX_SOURCE_BYTES: ${VOLUNDR_MAX_SOURCE_BYTES:-512000}
      VOLUNDR_MAX_STL_BYTES: ${VOLUNDR_MAX_STL_BYTES:-104857600}
      VOLUNDR_AI_PROVIDER: ${VOLUNDR_AI_PROVIDER:-gemini_api}
      VOLUNDR_OLLAMA_BASE_URL: ${VOLUNDR_OLLAMA_BASE_URL:-http://10.1.20.25:11434}
      VOLUNDR_OLLAMA_MODEL: ${VOLUNDR_OLLAMA_MODEL:-qwen2.5-coder:14b}
      VOLUNDR_OLLAMA_TIMEOUT_SECONDS: ${VOLUNDR_OLLAMA_TIMEOUT_SECONDS:-300}
      VOLUNDR_OLLAMA_THINK: ${VOLUNDR_OLLAMA_THINK:-}
      VOLUNDR_GEMINI_BINARY: ${VOLUNDR_GEMINI_BINARY:-gemini}
      VOLUNDR_GEMINI_MODEL: ${VOLUNDR_GEMINI_MODEL:-gemini-3.5-flash-lite}
      VOLUNDR_GEMINI_TIMEOUT_SECONDS: ${VOLUNDR_GEMINI_TIMEOUT_SECONDS:-120}
      VOLUNDR_GEMINI_POLICY_PATH: ${VOLUNDR_GEMINI_POLICY_PATH:-}
      VOLUNDR_GEMINI_API_BASE_URL: ${VOLUNDR_GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      VOLUNDR_GEMINI_API_TEMPERATURE: ${VOLUNDR_GEMINI_API_TEMPERATURE:-0.2}
      VOLUNDR_GEMINI_API_MAX_OUTPUT_TOKENS: ${VOLUNDR_GEMINI_API_MAX_OUTPUT_TOKENS:-8192}
      VOLUNDR_GEMINI_API_THINKING_LEVEL: ${VOLUNDR_GEMINI_API_THINKING_LEVEL:-minimal}
      VOLUNDR_GEMINI_API_MAX_RETRIES: ${VOLUNDR_GEMINI_API_MAX_RETRIES:-2}
      VOLUNDR_GEMINI_API_MAX_RETRY_SLEEP_SECONDS: ${VOLUNDR_GEMINI_API_MAX_RETRY_SLEEP_SECONDS:-60}
      VOLUNDR_GENERATION_MODE: ${VOLUNDR_GENERATION_MODE:-advanced}
      VOLUNDR_ENABLE_DESIGN_PLANS: ${VOLUNDR_ENABLE_DESIGN_PLANS:-true}
      VOLUNDR_ENABLE_MULTI_OUTPUT: ${VOLUNDR_ENABLE_MULTI_OUTPUT:-true}
      VOLUNDR_ENABLE_STRUCTURED_REVISIONS: ${VOLUNDR_ENABLE_STRUCTURED_REVISIONS:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${VOLUNDR_API_PORT:-8000}:8000"
    volumes:
      - ${VOLUNDR_DATA_DIR:-./data}:/app/data
      - ${VOLUNDR_GEMINI_DIR:-./data/gemini}:/home/volundr/.gemini
    networks:
      - volundr-internal

  volundr-cad-worker:
    container_name: volundr-cad-worker
    build:
      context: .
      dockerfile: cad-worker/Dockerfile
    restart: unless-stopped
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1024m
    cpus: 1.0
    environment:
      VOLUNDR_CAD_WORKSPACE_DIR: /work/jobs
      VOLUNDR_CAD_TIMEOUT_SECONDS: ${VOLUNDR_CAD_TIMEOUT_SECONDS:-60}
    volumes:
      - ${VOLUNDR_DATA_DIR:-./data}/jobs:/work/jobs
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m

networks:
  volundr-internal:
    name: volundr-internal
